[project]
name = "source"
version = "0.1.0"
description = "Event loop and semantic layer for the Altice Connected Home MCP"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.9",
]

[project.scripts]
home-loop = "source.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
