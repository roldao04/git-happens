<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>Alfred</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./ds/tokens.css" />
    <link rel="stylesheet" href="./ds/bundle.css" />
    <script>
      // The theme before the first paint: light, unless dark was chosen in Settings.
      try {
        var s = JSON.parse(localStorage.getItem("alfred-mobile-settings") || "{}");
        if (s.theme === "dark") document.documentElement.dataset.theme = "dark";
      } catch (e) {
        /* storage blocked or unreadable: stay light */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
